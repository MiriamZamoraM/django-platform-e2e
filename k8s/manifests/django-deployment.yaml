apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: django

  template:
    metadata:
      labels:
        app: django
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: django
          image: ghcr.io/miriamzamoram/django-platform-e2e:1.0
          ports:
            - containerPort: 8000
